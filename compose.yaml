services:

##########################################
##
## network infrastructure
##
##########################################

    shinobi-proxy:

        container_name: shinobi-proxy

        image: nginxproxy/nginx-proxy

        restart: unless-stopped

        ports:

            - "80:80"

            - "443:443"

        volumes:

            - /var/run/docker.sock:/tmp/docker.sock:ro

            - /var/docker/nginx/html:/usr/share/nginx/html

            - /var/docker/nginx/certs:/etc/nginx/certs

            - /var/docker/nginx/vhost:/etc/nginx/vhost.d

        logging:

            options:

                max-size: "10m"

                max-file: "3"

    shinobi-letsencrypt:

        container_name: shinobi-letsencrypt

        image: jrcs/letsencrypt-nginx-proxy-companion

        restart: unless-stopped

        volumes_from:

            - shinobi-proxy

        volumes:

            - /var/run/docker.sock:/var/run/docker.sock

            - /var/docker/nginx/acme:/etc/acme.sh

        environment:

            DEFAULT_EMAIL: workspace@valorantsoftware.digital

##########################################
##
## storage infrastructure
##
##########################################

    shinobi-database:

        container_name: shinobi-database

        image: mariadb

        volumes:

            - /tmp/volumes/mariadb:/var/lib/mysql

        ports:

            - "3306:3306"

        environment:

            MYSQL_ROOT_PASSWORD: aggiepride

            MYSQL_DATABASE: shinobipublicapis

            MYSQL_USER: shinobipublicapis

            MYSQL_PASSWORD: shinobipublicapis

    shinobi-phpmyadmin:

        container_name: shinobi-phpmyadmin

        image: beeyev/phpmyadmin-lightweight

        depends_on:

           - shinobi-database

        links:

           - shinobi-database

        ports:

            - "3380:80"

        environment:

            PMA_HOST: shinobi-database

            VIRTUAL_HOST: database.softwareshinobi.online

            LETSENCRYPT_HOST: database.softwareshinobi.online

##########################################
##
## API Server & Documentation
##
##########################################

    software-shinobi-apis:

        container_name: software-shinobi-apis

        image: softwareshinobi/software-shinobi-apis:production

        depends_on:

            - shinobi-database

        build:

            context: .

            dockerfile: Dockerfile

        restart: always

        ports:

            - "8888:8888"

        expose:

            - 8888

        environment:

            DB_HOST: shinobi-database

            DB_NAME: shinobipublicapis

            DB_USER: shinobipublicapis

            DB_PASS: shinobipublicapis

            VIRTUAL_PORT: 8888

            VIRTUAL_HOST: apis.softwareshinobi.online

            LETSENCRYPT_HOST: apis.softwareshinobi.online

    software-shinobi-app:

        container_name: software-shinobi-app

        image: softwareshinobi/software-shinobi-app:production

        build:

            context: app

            dockerfile: Dockerfile

        restart: always

        ports:

            - "8880:80"

        environment:

            VIRTUAL_HOST: app.softwareshinobi.online

            LETSENCRYPT_HOST: app.softwareshinobi.online

    software-shinobi-docs:

        container_name: software-shinobi-docs

        image: softwareshinobi/software-shinobi-docs:production

        build:

            context: docs

            dockerfile: Dockerfile

        restart: always

        ports:

            - "8880:80"

        environment:

            VIRTUAL_HOST: docs.apis.softwareshinobi.online

            LETSENCRYPT_HOST: docs.apis.softwareshinobi.online
